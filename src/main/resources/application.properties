spring.application.name=spring-boot-docker

# Datasource H2 (em mem�ria)
spring.datasource.url=jdbc:h2:mem:promptdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console H2 (Spring Boot 4 require o modulo spring-boot-h2console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Caminho para o JSON da specification OpenAPI (paradox: /v3/api-docs)
pringdoc.api-docs.path=/api-docs

# Caminho para a interface do Swagger UI (paradox: /swagger-ui.html)
springdoc.swagger-ui.path=/docs.html

# ============================================================
# NOTAS SOBRE SPRING DATA REST
# ============================================================
# Este projeto usa spring-boot-starter-data-rest, que expõe
# automaticamente os repositórios JPA como endpoints REST.
#
# Endpoints gerados ficam em: /data-rest/{recurso}
# Estratégia "annotated" exige @RepositoryRestResource no repo.
#
# Para desabilitar a exposição automática de um repositório,
# use @RepositoryRestResource(exported = false) ou remova a
# dependência spring-boot-starter-data-rest do pom.xml.
#
# Os endpoints customizados (/api/**) continuam funcionando
# normalmente e não são afetados por essas configurações.
# ============================================================
